# electron-builder configuration for the desktop program (step 4.8). Used only by the hosted build
# (.github/workflows/build.yml, job "desktop"); nothing here runs on a private machine.
#
# The program is laid out by desktop/scripts/stage.js into desktop/stage/ (the app folder below) and the swap-cli
# program of the same run into desktop/stage-bin/ (copied to resources/bin). Nothing is signed with a certificate: the
# Mac program gets an ad-hoc signature, which needs no identity, and the workflow uses no secrets. Nothing is published:
# the workflow passes --publish never and uploads build artifacts only.

# Neutral reverse-DNS identifier: it names no person (build spec section 11, point 22). The owner may change it
# before the first release; an installed program is keyed by it.
appId: no1d.swap.desktop
productName: No1d Swap
copyright: Copyright (c) 2026 00

directories:
  app: stage
  output: dist

# The sources are packed into app.asar (its integrity is checked by a fuse). The children of the program need real
# files: live.js and its packages (eth/), and the three Rust files poseidon2b.js reads (equiv/), so they stay unpacked
# next to the asar in app.asar.unpacked/. The unpacked files and bin/ are covered by runtime-manifest.json.
asar: true
asarUnpack:
  - eth/**
  - equiv/**

# The builder leaves out the node_modules folder of a sub-folder of the app by default, so without the second line
# eth/node_modules (ethers and its five packages) was not packed and live.js could not start (seen on the first Mac
# build). Its default filter still drops the TypeScript declaration files, which nothing reads at run time.
# stage.js manifest --stage refuses a packed program whose eth/node_modules is not the stage's.
files:
  - "**/*"
  - "eth/node_modules/**/*"

# swap-cli, from this run's swap-cli job, lands in resources/bin/.
extraResources:
  - from: stage-bin
    to: bin

# One installer name for each platform, without spaces (the sha256 file and the build provenance name it).
artifactName: No1d-Swap-${version}-${os}-${arch}.${ext}

# The packages are already in place (npm ci --omit=dev --ignore-scripts in stage/eth); no native module is rebuilt.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# No update files, no publishing: the program only notifies (desktop/lib/updates.js).
publish: null

# Fuses are switches flipped inside the program's own binary. desktop/scripts/fuses-check.js reads them back from the
# built program and from the installed one and requires exactly these values.
#   runAsNode on: live.js runs under the program's own binary with ELECTRON_RUN_AS_NODE=1.
#   the NODE_OPTIONS variable and the inspect switches off: nothing can inject code or open a debugger from outside.
#   asar integrity and "only load from asar" on: a changed app.asar does not start.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

# Windows x64, NSIS, installed for the current user only (no administrator rights), to %LOCALAPPDATA%\Programs\no1d-swap:
# a one-click install for the current user names its folder after the package name of desktop/package.json, not the product name.
win:
  target:
    - target: nsis
      arch:
        - x64
  # The program is not signed: no certificate is configured, so none is used (signing is off by default).

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  # An uninstall never deletes run folders or the vault (they live under %LOCALAPPDATA%\No1d Swap, outside the install folder).
  deleteAppDataOnUninstall: false
  differentialPackage: false

# macOS Apple Silicon, a disk image. Not signed with a certificate and not notarized: the system asks the user to open it
# by hand. identity "-" is an ad-hoc signature of the whole bundle, made after the fuses are flipped. With identity null
# the bundle kept only the linker's signature of the binary, which the flipped fuses no longer match, and macOS ended the
# program at start (seen on the first Mac build); with "-" codesign --verify --strict --deep passes and it starts.
# The disk image itself stays unsigned.
mac:
  target:
    - target: dmg
      arch:
        - arm64
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  category: public.app-category.finance

dmg:
  sign: false
  writeUpdateInfo: false
