[package]
name = "htlc_harness"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so the vendored Parano1d workspace is never modified.
[workspace]

[dependencies]
noid_core = { path = "../../vendor/parano1d/noid_core" }
noid_poseidon2b = { path = "../../vendor/parano1d/noid_poseidon2b" }
noid_tx = { path = "../../vendor/parano1d/noid_tx" }
noid_gkr = { path = "../../vendor/parano1d/noid_gkr" }
noid_pruv = { path = "../../vendor/parano1d/noid_pruv" }
serde_json = "1"

[profile.test]
opt-level = 3
