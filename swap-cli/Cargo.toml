[package]
name = "swap_cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline, test-driven skeleton of the two-role NOID<->ETH atomic-swap tool (TASKS M2.3-M2.6)"

# Standalone workspace: never a member of the vendored Parano1d workspace.
[workspace]

[lib]
name = "swap_cli"
path = "src/lib.rs"

[[bin]]
name = "swap-cli"
path = "src/main.rs"

[dependencies]
# The M0 harness: Addr/Derive, the compiled HashTimeLock opening, prove/verify, the tool guard.
htlc_harness = { path = "../parano1d/harness" }
noid_core = { path = "../vendor/parano1d/noid_core" }
noid_poseidon2b = { path = "../vendor/parano1d/noid_poseidon2b" }
noid_tx = { path = "../vendor/parano1d/noid_tx" }
noid_gkr = { path = "../vendor/parano1d/noid_gkr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

[features]
# Test-only switches (REVIEW-2 F14): `--fast-kdf` and `KdfParams::fast_for_tests`. Off in every normal build.
dev = []

[dev-dependencies]
tempfile = "3"
# The crate depends on itself with `dev` so that `cargo test` (library, binary and integration tests alike)
# has the fast KDF, while `cargo build` and `cargo build --release` do not.
swap_cli = { path = ".", features = ["dev"] }

# Same as parano1d/harness so the shared CARGO_TARGET_DIR reuses its compiled vendor crates.
[profile.test]
opt-level = 3
